micronaut:
  server:
    # Puerto aleatorio. Con el 8081 fijo del yml principal, dos clases de test
    # que levantan servidor chocan entre si —o con el servicio corriendo en la
    # maquina— y la bateria falla con BindException de forma intermitente.
    port: -1

# Los procesos periodicos no corren solos en los tests: cada test invoca el
# ciclo cuando lo necesita, y asi no compiten por la cola ni por la base.
whatsapp:
  consumer:
    enabled: false
  # Los tests de la cola cuentan envios exactos: los stickers se prueban aparte.
  stickers:
    enabled: false
agent:
  summary:
    job-enabled: false
