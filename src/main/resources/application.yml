micronaut:
  application:
    name: agents-services
  server:
    # 8080 lo ocupa erp_maya_services; compartir puerto en la misma maquina
    # solo produce BindException al levantar los dos.
    port: 8081

datasources:
  default:
    db-type: postgres
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver
    # Sin url ni credenciales aqui: en local las provee test-resources
    # (Postgres en Docker) y en despliegue las variables de entorno.
    schema-generate: NONE

# Liquibase es la unica fuente del esquema. Nada de schema-generate.
liquibase:
  datasources:
    default:
      change-log: classpath:db/changelog/db.changelog-master.yaml

# El contexto de ejecucion es configuracion, no datos: cinco minutos de cache
# ahorran una consulta de siete tablas por mensaje, y ese es el retraso maximo
# con el que se propaga apagar el bot de una empresa.
caches:
  execution-context:
    expire-after-write: 5m
    maximum-size: 500

# Clientes autorizados a llamar /v1/agent/turn. La clave SIEMPRE por variable
# de entorno: un cliente sin api-key queda deshabilitado, nunca comodin.
# Los scopes salen de aqui, jamas del cuerpo de la peticion.
agent:
  clients:
    whatsapp-adapter:
      api-key: ${AGENT_KEY_WHATSAPP:}
      scopes:
        - productos.read
        - clientes.read
        - cotizaciones.read
        - cotizaciones.write
    erp-widget:
      api-key: ${AGENT_KEY_ERP:}
      scopes:
        - productos.read
        - clientes.read
        - cotizaciones.read

# Canal de WhatsApp. Los dos secretos, siempre por variable de entorno: sin
# app-secret el webhook se rechaza entero en vez de aceptar sin verificar.
whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  # Se agrupan los mensajes del mismo remitente que lleguen dentro de esta
  # ventana: quien escribe tres lineas seguidas espera una respuesta, no tres.
  burst-window-seconds: 3

# Servicio externo. Las rutas concretas aun no estan validadas contra
# maya-erp-services: van marcadas con TODO en ErpClient.
erp:
  base-url: ${ERP_BASE_URL:`http://localhost:8080`}
  timeout-ms: ${ERP_TIMEOUT_MS:10000}
  # Credenciales de maquina (client credentials), nunca un usuario-persona.
  client-id: ${ERP_CLIENT_ID:}
  client-secret: ${ERP_CLIENT_SECRET:}
