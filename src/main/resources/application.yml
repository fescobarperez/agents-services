micronaut:
  application:
    name: agents-services
  server:
    # 8080 lo ocupa erp_maya_services; compartir puerto en la misma maquina
    # solo produce BindException al levantar los dos.
    port: 8081

datasources:
  default:
    db-type: postgres
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver
    # Sin url ni credenciales aqui: en local las provee test-resources
    # (Postgres en Docker) y en despliegue las variables de entorno.
    schema-generate: NONE

# Liquibase es la unica fuente del esquema. Nada de schema-generate.
liquibase:
  datasources:
    default:
      change-log: classpath:db/changelog/db.changelog-master.yaml

# El contexto de ejecucion es configuracion, no datos: cinco minutos de cache
# ahorran una consulta de siete tablas por mensaje, y ese es el retraso maximo
# con el que se propaga apagar el bot de una empresa.
caches:
  execution-context:
    expire-after-write: 5m
    maximum-size: 500

# Clientes autorizados a llamar /v1/agent/turn. La clave SIEMPRE por variable
# de entorno: un cliente sin api-key queda deshabilitado, nunca comodin.
# Los scopes salen de aqui, jamas del cuerpo de la peticion.
agent:
  clients:
    whatsapp-adapter:
      api-key: ${AGENT_KEY_WHATSAPP:}
      scopes:
        - productos.read
        - clientes.read
        - cotizaciones.read
        - cotizaciones.write
    erp-widget:
      api-key: ${AGENT_KEY_ERP:}
      scopes:
        - productos.read
        - clientes.read
        - cotizaciones.read
        # El ERP avisa al cliente cuando el vendedor aplica sus solicitudes.
        - notificaciones.write
    # Consola de plataforma (via stack-line-services): administra modelos y
    # agentes en /v1/admin/ai. Solo el scope admin; no atiende turnos.
    platform-admin:
      api-key: ${AGENT_KEY_PLATFORM:}
      scopes:
        - admin

  # Resumen de la conversacion. El disparador normal es la inactividad; en
  # conversaciones largas y continuas hay ademas un respaldo dentro del turno
  # para no perder mensajes que salen de la ventana del prompt.
  summary:
    job-enabled: true
    inactivity-minutes: 10
    check-interval: 1m
    batch-size: 20


# Canal de WhatsApp. Los dos secretos, siempre por variable de entorno: sin
# app-secret el webhook se rechaza entero en vez de aceptar sin verificar.
whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  # Se agrupan los mensajes del mismo remitente que lleguen dentro de esta
  # ventana: quien escribe tres lineas seguidas espera una respuesta, no tres.
  # Es deslizante: cada mensaje nuevo empuja a los anteriores (tope de 15 s).
  burst-window-seconds: 3
  # Envio por la Graph API. El token, como los otros secretos, solo por
  # variable de entorno; sin el, los envios fallan y vuelven a la cola.
  graph-url: ${WHATSAPP_GRAPH_URL:`https://graph.facebook.com/v23.0`}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  # Consumidor de la cola: corre en proceso, cada `interval`.
  consumer:
    enabled: ${WHATSAPP_CONSUMER_ENABLED:true}
    interval: 1s
    batch-size: 20
  # Stickers animados de Tino (resources/stickers). Cuando enviar uno lo
  # decide el modelo con la herramienta `tino.sticker`; esto solo los apaga.
  stickers:
    enabled: ${WHATSAPP_STICKERS_ENABLED:true}

# Canal web: widget de chat en la pagina de la empresa (/v1/web). Es publico:
# lo protegen el dominio de cada widget (se configura en la consola) y estos
# limites por minuto. `public-url` es la direccion publica de este servicio;
# con ella la consola arma el <script> que pega la empresa.
web:
  public-url: ${AGENT_PUBLIC_URL:}
  # Detras del proxy la IP real viene en X-Forwarded-For.
  trust-forwarded: ${WEB_TRUST_FORWARDED:true}
  # Lo que puede hacer el agente en la web (sin api-key: la llamada no sale del proceso).
  scopes:
    - productos.read
    - clientes.read
    - cotizaciones.read
    - cotizaciones.write
  rate:
    session-per-minute: 10
    ip-per-minute: 30
    widget-per-minute: 120

# Servicio externo. Las rutas concretas aun no estan validadas contra
# maya-erp-services: van marcadas con TODO en ErpClient.
erp:
  base-url: ${ERP_BASE_URL:`http://localhost:8080`}
  timeout-ms: ${ERP_TIMEOUT_MS:10000}
  # Llave de servicio para pedir al ERP un token por empresa
  # (POST /api/internal/service-token). Es la misma AGENT_KEY_ERP.
  service-key: ${AGENT_KEY_ERP:}
