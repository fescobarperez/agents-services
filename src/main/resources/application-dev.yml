# Perfil dev: esquema agents_dev, en la misma base que el ERP (que usa
# stackline_dev). Cada proyecto vive en su esquema; el `public` no se toca.
#
# Host, puerto y base por variable: en tu máquina el Postgres local
# (localhost:5433); en el servidor, DB_HOST apunta a RDS desde el compose.
# La contraseña llega por DB_PASSWORD.
#
# El esquema debe existir antes del primer arranque (Liquibase no lo crea):
#   CREATE SCHEMA IF NOT EXISTS agents_dev;
#
# `currentSchema` fija el search_path: las tablas y las de control de
# Liquibase quedan en agents_dev. `public` va detrás para encontrar
# extensiones instaladas ahí (p. ej. pgvector).
datasources:
  default:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:erp_maya}?currentSchema=agents_dev"
    username: ${DB_USER:erp_maya}
    # Sin valor por defecto a proposito: si falta, el arranque falla con un
    # error claro en vez de intentar con una contrasena inventada.
    password: ${DB_PASSWORD}
