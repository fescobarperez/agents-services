# Esquema de maya-agent-service.
#
# Un archivo por dominio, un changeset por tabla, cada uno con su rollback.
# Regla que no se rompe: un changeset ya aplicado NUNCA se edita. Si algo
# cambia, se agrega otro changeset.
databaseChangeLog:
  - include:
      file: db/changelog/changes/01-ai-config.yaml
  - include:
      file: db/changelog/changes/02-channels.yaml
  - include:
      file: db/changelog/changes/03-runtime.yaml
  - include:
      file: db/changelog/changes/04-queue.yaml
  - include:
      file: db/changelog/changes/05-seed.yaml
  - include:
      file: db/changelog/changes/06-playbooks.yaml
