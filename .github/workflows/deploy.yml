# Despliegue a producción — SOLO manual.
#
# Espejo del flujo de stack-line-services y stack-line-ui. Existe para poder
# publicar desde el repositorio que estás tocando: el servidor hace pull de
# los TRES repos y reconstruye lo que cambió, así que da igual desde cuál se
# lance. Por defecto reconstruye solo el agente.
#
# Si editas este archivo, actualiza también el de los otros repositorios.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Qué reconstruir"
        type: choice
        required: true
        default: agents
        options: [agents, auto, backend, web, all]

# Comparte grupo con los flujos de los otros repositorios: dos despliegues a
# la vez sobre el mismo servidor se pisan, vengan de donde vengan.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Permite exigir aprobación antes de correr:
    # Settings → Environments → produccion → Required reviewers.
    environment: produccion
    # Compilar Kotlin en la instancia tarda más que el backend.
    timeout-minutes: 30

    steps:
      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Huella fija del servidor: sin esto, un intermediario podría
          # suplantarlo y recibir la clave.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "~/stackline/stack-line-services/deploy/deploy.sh ${{ inputs.target }}"

      - name: Limpiar
        if: always()
        run: rm -f ~/.ssh/deploy_key
