# Despliegue a producción — SOLO manual.
#
# Despliega únicamente el agente (agents-services): el servidor trae solo este repo y
# reconstruye solo su contenedor. El backend se publica desde
# stack-line-services.

name: Deploy

on:
  workflow_dispatch:

# Comparte grupo con los flujos de los otros repositorios: dos despliegues a
# la vez sobre el mismo servidor se pisan, vengan de donde vengan.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Permite exigir aprobación antes de correr:
    # Settings → Environments → produccion → Required reviewers.
    environment: produccion
    # Compilar Kotlin en la instancia tarda más que el backend.
    timeout-minutes: 30

    steps:
      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Huella fija del servidor: sin esto, un intermediario podría
          # suplantarlo y recibir la clave.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "~/stackline/stack-line-services/deploy/deploy.sh agents"

      - name: Limpiar
        if: always()
        run: rm -f ~/.ssh/deploy_key
